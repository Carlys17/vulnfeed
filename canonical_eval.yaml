    base_url: https://carly17.my.id/vulnfeed
intent: ONCHAIN_TX_LOOKUP
description: >
  Canonical evaluation script for VulnFeed smart-contract security miner.
  Scores accuracy against ground truth of known Base mainnet contracts.
ground_truth:
  - address: 0x2626664c2603336E57B271c5C0b26F421741e481
    contract: Uniswap SwapRouter02 (Base)
    expected_rating: critical
    expected_high: 3
    known_bug: complex router with unchecked transfers and delegatecall loops
  - address: 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
    contract: USDC (Base Centre proxy)
    expected_rating: clean
    expected_high: 0
