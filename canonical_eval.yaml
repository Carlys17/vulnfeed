metrics:
  rating_accuracy: exact match of predicted vs expected rating
  high_f1: F1 score for high-severity detection (critical=yes, else no)
  rating_distance: mean absolute ordinal distance (clean=0, moderate=1, elevated=2, critical=3)
  determinism: fraction of identical outputs across repeated runs
  latency_p50_s: median response time
scoring:
  rating_accuracy: weight 0.3
  high_f1: weight 0.3
  rating_distance: weight 0.2
  determinism: weight 0.1
  latency_p50_s: weight 0.1 (inverted — lower is better)
guardrails:
  min_samples: 3
  min_requests_served: 100
  require_canonical_intents: true
